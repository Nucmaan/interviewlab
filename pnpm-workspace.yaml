packages:
  - apps/*
  - packages/*
  - tests/*

# pnpm blocks dependency install scripts unless they are listed here (supply-chain protection).
allowBuilds:
  esbuild: true
  unrs-resolver: false
  msgpackr-extract: false
  # Usage telemetry of swagger-ui-dist: not allowed to run.
  "@scarf/scarf": false
  prisma: true
  '@prisma/engines': true
