# IRCUB - full local stack.
#   cp .env.example .env && docker compose up --build
name: ircub

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  CHANNEL_CALLBACK_SECRET: ${CHANNEL_CALLBACK_SECRET}
  MOCK_SERVICES_URL: http://mock-services:4000
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate ircub_test database used by the integration tests.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: apply Prisma migrations, the raw SQL in /sql, then seed demo data. Exits when done.
  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      <<: *app-env
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ircub.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  mock-services:
    build:
      context: .
      dockerfile: apps/mock-services/Dockerfile
    environment:
      <<: *app-env
      PORT: 4000
      IRCUB_CALLBACK_URL: http://web:3000/api/payments/callback
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.1}
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-300}
      MOCK_DATA_DIR: /data
    ports:
      - '${MOCK_SERVICES_PORT:-4000}:4000'
    volumes:
      - mockdata:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: 'true'
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-services:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mockdata:
