# Continuous integration: every pull request and every push to main must pass these checks
# before it can be merged / deployed. See answers/part-4-security-planning-qa.md (CI/CD).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma needs a URL to generate the client; nothing connects in this job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ircub/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ircub
          POSTGRES_PASSWORD: ircub_ci
          POSTGRES_DB: ircub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ircub" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ircub:ircub_ci@localhost:5432/ircub_test
      TEST_DATABASE_URL: postgresql://ircub:ircub_ci@localhost:5432/ircub_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ircub/db generate
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests (full Docker Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          # The migrate service seeds the database first; wait until the app reports healthy.
          timeout 600 bash -c 'until curl -fs http://localhost:3000/api/health; do sleep 5; done'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
